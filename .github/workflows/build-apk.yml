name: Build Ceylon Journey APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Extract Android Project
        run: |
          ZIP=$(find . -maxdepth 1 -iname 'Ceylon-Journey-Android-Source*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Android source ZIP not found"
            exit 1
          fi
          unzip -o "$ZIP" -d .

      - name: Add AndroidX Core Dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android-app/app/build.gradle")
          s = p.read_text()

          dep = "implementation 'androidx.core:core:1.15.0'"

          if dep not in s:
              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    " + dep,
                      1
                  )
              else:
                  s += "\n\ndependencies {\n    " + dep + "\n}\n"

              p.write_text(s)

          print("AndroidX Core dependency added successfully")
          PY
          
      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android Project
        run: |
          ls -la android-app
          ls -la android-app/app

      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ceylon-Journey-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
